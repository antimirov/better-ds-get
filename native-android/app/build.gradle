plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.antimirov.betterdsget'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.antimirov.betterdsget.nativeapp"
        minSdk = 26
        targetSdk = 35
        versionCode = 4
        versionName = "1.6.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            def userDebugKeystore = file("${System.getProperty('user.home')}/.android/debug.keystore")
            storeFile userDebugKeystore.exists() ? userDebugKeystore : file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.debug
        }
        debug {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Zero runtime bloat: pure Android SDK + org.json on device.
    // Unit & Integration testing dependencies (JVM-only, 0 bytes in APK):
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

